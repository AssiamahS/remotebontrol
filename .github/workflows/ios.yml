name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', 'tools/**', '.github/workflows/ios.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: ios

jobs:
  build:
    name: Build (unsigned compile check)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Remotebontrol.xcodeproj \
            -scheme Remotebontrol \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  screenshots:
    name: App Store screenshots (simulator, demo data)
    runs-on: macos-26
    timeout-minutes: 40
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick a Pro Max simulator
        id: sim
        run: |
          xcrun simctl list devices available -j > devices.json
          UDID=$(python3 - <<'EOF'
          import json
          d = json.load(open("devices.json"))["devices"]
          picks = []
          for runtime, devs in d.items():
              if "iOS" not in runtime: continue
              for x in devs:
                  if x["isAvailable"] and x["name"].startswith("iPhone"):
                      score = (("Pro Max" in x["name"]) * 2 + ("Pro" in x["name"]), runtime)
                      picks.append((score, x["udid"], x["name"]))
          picks.sort(reverse=True)
          print(picks[0][1])
          import sys; print(picks[0][2], file=sys.stderr)
          EOF
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Remotebontrol.xcodeproj \
            -scheme Remotebontrol \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Capture
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -x
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find build/Build/Products -name "Remotebontrol.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          i=1
          for tab in remote keypad apps; do
            xcrun simctl terminate "$UDID" com.assiamah.remotebontrol || true
            SIMCTL_CHILD_REMOTE_DEMO=1 xcrun simctl launch "$UDID" com.assiamah.remotebontrol -tab "$tab"
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/0${i}-${tab}.png"
            echo "--- $tab: alive=$(pgrep -f 'Remotebontrol.app/Remotebontrol' | wc -l | tr -d ' ')"
            i=$((i+1))
          done
          ls -la shots
          # diagnostics: crash reports + last minute of app log, in case a tab came up blank
          mkdir -p shots/diag
          cp ~/Library/Logs/DiagnosticReports/Remotebontrol* shots/diag/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Remotebontrol"' --style compact > shots/diag/app.log 2>&1 || true
          ls -la shots/diag; grep -iE "fatal|crash|exception|error" shots/diag/app.log | head -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/shots/
      - name: Upload screenshots to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::notice::no ASC secrets, skipping upload"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          export ASC_P8_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          python3 -m pip install --quiet --break-system-packages pillow || pip3 install --quiet --user pillow
          python3 ../tools/asc_screenshots.py shots/0[1-3]-*.png

  testflight:
    name: Sign & upload to TestFlight + ad hoc install page
    runs-on: macos-26
    timeout-minutes: 45
    needs: build
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for App Store Connect credentials
        id: creds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ASC secrets not set — skipping TestFlight upload"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write App Store Connect API key
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc" "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          cp "$RUNNER_TEMP/asc/AuthKey.p8" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install XcodeGen
        if: steps.creds.outputs.have == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.creds.outputs.have == 'true'
        run: |
          # stamp the run number BEFORE generating — xcodegen bakes CFBundleVersion into the plists
          sed -i '' "s/^    CURRENT_PROJECT_VERSION: .*/    CURRENT_PROJECT_VERSION: $GITHUB_RUN_NUMBER/" project.yml
          xcodegen generate

      - name: Archive (unsigned)
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # archive UNSIGNED; exportArchive does the cloud signing. Archiving with cloud
          # signing mints a throwaway "Created via API" dev cert per run and hits the 10-cert cap.
          xcodebuild archive \
            -project Remotebontrol.xcodeproj \
            -scheme Remotebontrol \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Remotebontrol.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER

      - name: Export & upload to App Store Connect
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Remotebontrol.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export ad hoc IPA (registered devices only)
        if: steps.creds.outputs.have == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Remotebontrol.xcarchive \
            -exportOptionsPlist ExportOptionsAdHoc.plist \
            -exportPath build/adhoc \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/adhoc

      - name: Publish install page to GitHub Pages
        if: steps.creds.outputs.have == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p web/ipa
          cp ios/build/adhoc/*.ipa web/ipa/Remotebontrol.ipa
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/build/Remotebontrol.xcarchive/Products/Applications/Remotebontrol.app/Info.plist)
          cat > web/ipa/manifest.plist <<EOF2
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array>
              <dict><key>kind</key><string>software-package</string><key>url</key><string>https://assiamahs.github.io/remotebontrol/ipa/Remotebontrol.ipa</string></dict>
              <dict><key>kind</key><string>display-image</string><key>url</key><string>https://assiamahs.github.io/remotebontrol/icon-180.png</string></dict>
              <dict><key>kind</key><string>full-size-image</string><key>url</key><string>https://assiamahs.github.io/remotebontrol/icon-512.png</string></dict>
            </array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>com.assiamah.remotebontrol</string>
              <key>bundle-version</key><string>${VERSION}</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>Remote</string>
            </dict>
          </dict></array></dict></plist>
          EOF2
          sed -i '' -E "s/Build [^·]*· [^·]*·/Build $GITHUB_RUN_NUMBER (v$VERSION) · $(date -u +%Y-%m-%d) ·/; s/BUILD_NUMBER/$GITHUB_RUN_NUMBER/; s/BUILD_DATE/$(date -u +%Y-%m-%d)/" web/install.html || true
          git checkout -- ios/project.yml   # drop the run-number stamp so the rebase is clean
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/ipa web/install.html
          git commit -m "build: ad hoc IPA build $GITHUB_RUN_NUMBER" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          # a GITHUB_TOKEN push never triggers other workflows; dispatch Pages explicitly
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
